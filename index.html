*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
  background:linear-gradient(135deg,#111,#252525); font-family:Arial,sans-serif;
  color:white; overflow:hidden;
}
.card{
  width:min(92vw,430px); padding:22px 18px 26px; border-radius:24px;
  background:rgba(255,255,255,.09); backdrop-filter:blur(12px);
  box-shadow:0 20px 60px rgba(0,0,0,.45); text-align:center;
}
.photo{
  width:100%; max-height:58vh; object-fit:cover; border-radius:18px;
  display:block; margin:0 auto 18px;
}
h1{font-size:clamp(24px,7vw,34px); margin:8px 0 20px; line-height:1.1}
.msg{font-size:20px; font-weight:800; line-height:1.35; margin:8px 0 20px}
.buttons{display:flex; gap:14px; justify-content:center}
button{
  border:0; border-radius:14px; padding:15px 28px; font-size:19px;
  font-weight:800; cursor:pointer; min-width:120px;
}
.yes{background:#25d366;color:#071b0d}
.no{background:#fff;color:#111;position:relative}
.next{background:#ffb000;color:#171000;width:100%}
.shake{animation:shake .25s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.hidden{display:none}
</style>
